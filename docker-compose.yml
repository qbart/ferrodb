services:
  pg_test:
    image: postgres:16.8
    ports:
      - 5433:5432
    environment:
      - POSTGRES_PASSWORD=test
      - POSTGRES_USER=test
      - POSTGRES_DB=test

  mysql_test:
    image: mysql
    ports:
      - 3307:3306
    environment:
      - MYSQL_ROOT_PASSWORD=test
      - MYSQL_DATABASE=test
      - MYSQL_USER=test
      - MYSQL_PASSWORD=test

  mariadb:
    image: mariadb
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=test
      - MARIADB_DATABASE=test
      - MARIADB_USER=test
      - MARIADB_PASSWORD=test
    ports:
      - 3309:3306

  clickhouse_test:
    image: clickhouse/clickhouse-server
    ports:
      - "9001:9000"
    environment:
      CLICKHOUSE_DB: "test"
      CLICKHOUSE_USER: "test"
      CLICKHOUSE_PASSWORD: "test"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
