name: Test

on:
  push:

jobs:
  test:
    strategy:
      matrix:
        driver:
          - postgresql
          - sqlite

    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8
        ports:
          - 5433:5432
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.4

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        env:
          DATABASE_URL: "postgres://test:test@localhost:5432/test?sslmode=disable&prefer_simple_protocol=true"
        run: |
          mkdir -p bin/
          go test -v ./...
